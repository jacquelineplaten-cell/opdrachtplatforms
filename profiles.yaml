# Dit bestand stuurt de scoring aan. Pas het gerust met de hand aan: elk woord dat je
# hier toevoegt of weghaalt verandert direct wat er in de vrijdagmail terechtkomt.
#
# Per persoon:
#   rollen      - functietitels die bij deze persoon passen. Tellen zwaar mee als ze in
#                 de TITEL van een uitvraag staan, licht als ze in de tekst staan.
#   sectoren    - opdrachtgevers/markten. Gematcht op opdrachtgever + volledige tekst.
#   expertise   - vakinhoud, methoden en thema's. Gematcht op de volledige tekst.
#   uitsluiten  - termen die deze persoon juist NIET wil; trekken de score omlaag.
#   boost       - extra punten bij specifieke termen (bv. een expliciete wens).
#   actief      - op false zetten om iemand tijdelijk uit de mail te halen.
#
# Matching is hoofdletterongevoelig en op hele woorden (met flexibele meervoud/koppelteken).

