name: Wekelijkse opdrachtalert

on:
  schedule:
    # GitHub cron draait op UTC. 05:00 UTC is 07:00 in de zomertijd, 06:00 UTC is
    # 07:00 in de wintertijd; de tweede is tegelijk een reserve als de eerste
    # wordt overgeslagen. Er staat bewust GEEN controle op de lokale tijd meer:
    # GitHub stelt geplande runs soms uren uit (op 09-10-2026 meer dan zes), en
    # een tijdvenster gooit zo'n vertraagde run weg waardoor de mail die week
    # helemaal uitblijft. Dat er per week maar één mail uitgaat, bewaakt de alert
    # zelf aan de hand van state/gezien.json.
    - cron: "0 5 * * 5"
    - cron: "0 6 * * 5"
  workflow_dispatch:
    inputs:
      droogloop:
        description: "Alleen tonen wat er verstuurd zou worden, niet mailen"
        type: boolean
        default: false
      drempel:
        description: "Afwijkende drempelscore (1-10)"
        type: string
        default: ""
      forceer:
        description: "Ook versturen als er deze week al een alert uitging"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: opdrachtalert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Afhankelijkheden installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Playwright staat hier bewust niet bij. Het is alleen nodig voor de
          # browserpoging van Circle8, en die komt ook met een echte browser
          # niet door de botbescherming heen vanaf een GitHub-runner. Zet je
          # platforms.circle8.gebruik_browser in config.yaml weer op true, voeg
          # dan deze twee regels toe:
          #   pip install playwright
          #   python -m playwright install --with-deps chromium

      - name: Alert draaien
        env:
          PYTHONPATH: src
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          argumenten=(--uitvoer out/alert.html)
          if [ "${{ inputs.droogloop }}" = "true" ]; then
            argumenten+=(--droogloop)
          fi
          if [ -n "${{ inputs.drempel }}" ]; then
            argumenten+=(--drempel "${{ inputs.drempel }}")
          fi
          if [ "${{ inputs.forceer }}" = "true" ]; then
            argumenten+=(--forceer)
          fi
          python -m opdrachtalert.main "${argumenten[@]}"

      - name: Mail bewaren als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opdrachtalert-html
          path: out/alert.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Onthouden wat al verstuurd is
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Bijwerken verstuurde uitvragen $(date -u +%Y-%m-%d)"
            # Een andere run of een handmatige commit kan de branch verzet hebben.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Geen wijziging in state/, niets te committen."
          fi
